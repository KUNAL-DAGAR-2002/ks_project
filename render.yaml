services:
  - type: web
    name: kirana-saathi-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: KIRANA_DATABASE_URL
        sync: false
      - key: KIRANA_JWT_SECRET
        generateValue: true
      - key: KIRANA_ACCESS_TOKEN_MINUTES
        value: 60
      - key: KIRANA_GEMINI_API_KEY
        sync: false
      - key: KIRANA_GEMINI_MODEL
        value: gemini-2.5-flash
      - key: KIRANA_ADMIN_USERNAME
        sync: false
      - key: KIRANA_ADMIN_PASSWORD
        sync: false
      - key: KIRANA_CORS_ORIGINS
        sync: false
      - key: KIRANA_UPLOAD_DIR
        value: /opt/render/project/src/uploads

  - type: web
    name: kirana-saathi
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: VITE_API_URL
        sync: false
